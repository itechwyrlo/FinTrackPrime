<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Background for contrast on both light and dark browser themes -->
  <rect width="64" height="64" rx="14" fill="#111827"/>
  
  <!-- Geometric "F" with an upward growth chart element -->
  <!-- Vertical pillar of the F (representing stability) -->
  <rect x="18" y="14" width="8" height="36" rx="2" fill="#FFFFFF"/>
  
  <!-- Top horizontal bar of the F -->
  <rect x="26" y="14" width="20" height="8" rx="2" fill="#FFFFFF"/>
  
  <!-- Middle horizontal bar of the F -->
  <rect x="26" y="28" width="12" height="8" rx="2" fill="#FFFFFF"/>
  
  <!-- Gold Accent: Upward-trending growth indicator integrated into the structure -->
  <polygon points="40,28 48,28 48,14" fill="#C5A059"/>
  <rect x="42" y="38" width="8" height="12" rx="2" fill="#004B87"/>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>You're offline — FinTrack Prime</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111827;
        color: #f3f4f6;
        font-family:
          'Public Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-family: 'Libre Caslon Text', Georgia, 'Times New Roman', serif;
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        color: rgba(243, 244, 246, 0.7);
        font-size: 0.9375rem;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #c5a059;
        color: #111827;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #ad8a45;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>FinTrack Prime needs a connection to load your accounts and data. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
